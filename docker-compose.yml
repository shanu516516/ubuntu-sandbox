services:
  ubuntu:
    build: .
    container_name: ubuntu-sandbox
    hostname: sandbox
    stdin_open: true
    tty: true
    restart: unless-stopped
    working_dir: /home/ubuntu
    volumes:
      - ./data/ubuntu:/home/ubuntu
      - ./data/root:/root
      - ./data/workspace:/workspace
      - ./data/ssh:/etc/ssh
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - go-mod-cache:/go/pkg/mod
      - pnpm-store:/home/ubuntu/.local/share/pnpm/store
      # - ./data:/
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - ROOT_PASSWORD=${ROOT_PASSWORD:-root123}
      - UBUNTU_PASSWORD=${UBUNTU_PASSWORD:-ubuntu123}
      - ENABLE_SSH=${ENABLE_SSH:-false}
      - UBUNTU_NOPASSWD_SUDO=${UBUNTU_NOPASSWD_SUDO:-false}
    ports:
      - "${SSH_HOST:-127.0.0.1}:${SSH_PORT:-2222}:22"

    # --- Security hardening ---
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_RAW
      - SYS_CHROOT
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:false
    read_only: false
    tmpfs:
      - /tmp
      - /run
    pids_limit: 512
    mem_limit: 4g
    cpus: 4

    networks:
      - sandbox_net

networks:
  sandbox_net:
    driver: bridge
    internal: false

volumes:
  cargo-registry:
  cargo-git:
  go-mod-cache:
  pnpm-store:
